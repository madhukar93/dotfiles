# lsd colours for a light background. Darker values so text stays readable.
user: 24
group: 94
permission:
  read: dark_green
  write: dark_yellow
  exec: dark_red
  exec-sticky: 5
  no-access: 240
  octal: 6
  acl: dark_cyan
  context: cyan
date:
  hour-old: 22
  day-old: 28
  older: 240
size:
  none: 240
  small: 22
  medium: 94
  large: 124
inode:
  valid: 54
  invalid: 240
links:
  valid: 54
  invalid: 240
tree-edge: 240
git-status:
  default: 240
  unmodified: 240
  ignored: 240
  new-in-index: dark_green
  new-in-workdir: dark_green
  typechange: dark_yellow
  deleted: dark_red
  renamed: dark_green
  modified: dark_yellow
  conflicted: dark_red
